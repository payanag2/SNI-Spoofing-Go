name: Automatic Build Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build all release binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Build all CLI binaries
        run: make dist

      - name: Install Linux GUI build dependencies
        run: make deps-linux

      - name: Build Windows GUI AMD64
        run: make gui-windows-amd64

      - name: Build Windows GUI ARM64
        run: make gui-windows-arm64

      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create automatic release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="build-${{ github.run_number }}"
          title="Automatic Build #${{ github.run_number }}"
          gh release create "$tag" \
            dist/* \
            --title "$title" \
            --generate-notes
