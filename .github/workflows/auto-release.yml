name: Automatic Build Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows GUI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Linux GUI build dependencies
        run: make deps-linux

      - name: Build Windows GUI
        run: make gui-windows-amd64

      - name: Locate Windows executable/package
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          asset="$(make -s gui-asset-windows-amd64)"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          sha256sum "$asset" | tee "${asset}.sha256"

      - name: Create automatic release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="build-${{ github.run_number }}"
          title="Automatic Build #${{ github.run_number }}"
          gh release create "$tag" \
            "${{ steps.asset.outputs.asset }}" \
            "${{ steps.asset.outputs.asset }}.sha256" \
            --title "$title" \
            --generate-notes
